name: Poznámky – sestavení APK

on:
  push:
    paths:
      - "NotesApp/**"
      - ".github/workflows/notes-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotesApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sestavit APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: poznamky-apk
          path: NotesApp/app/build/outputs/apk/release/*.apk
