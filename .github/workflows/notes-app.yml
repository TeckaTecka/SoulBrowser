name: Poznámky – sestavení APK

on:
  push:
    paths:
      - "NotesApp/**"
      - ".github/workflows/notes-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NotesApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sestavit APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: poznamky-apk
          path: NotesApp/app/build/outputs/apk/release/*.apk
      - name: Přejmenovat APK
        run: cp app/build/outputs/apk/release/app-release.apk Poznamky.apk
      - name: Zveřejnit jako release (stálý odkaz ke stažení)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: poznamky-latest
          name: Poznámky – nejnovější verze
          body: "Automaticky sestaveno z commitu ${{ github.sha }}."
          prerelease: true
          files: NotesApp/Poznamky.apk
